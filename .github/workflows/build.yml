name: Build libllama.so

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        abi: [arm64-v8a, armeabi-v7a]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26b
          add-to-path: true

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build

      - name: Clone llama.cpp
        run: git clone --depth=1 https://github.com/ggml-org/llama.cpp

      - name: Clone miniz
        run: git clone --depth=1 https://github.com/richgel999/miniz src/third_party/miniz

      - name: Configure
        run: cmake -S src -B build -G Ninja -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake -DANDROID_ABI=${{ matrix.abi }} -DANDROID_PLATFORM=android-24 -DANDROID_ARM_NEON=ON -DLLAMA_DIR=$PWD/llama.cpp -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build -j

      - name: Package
        run: mkdir -p out && cp build/libllama.so out/libllama-${{ matrix.abi }}.so && cd out && sha256sum libllama-${{ matrix.abi }}.so > libllama-${{ matrix.abi }}.so.sha256 && ls -lh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: libllama-${{ matrix.abi }}
          path: out/*

  release:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Lexa Native v1.0.${{ github.run_number }}
          files: out/*
          token: ${{ secrets.GITHUB_TOKEN }}
