name: Build libllama.so

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26b
          add-to-path: true

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build

      - name: Clone llama.cpp
        run: git clone --depth=1 https://github.com/ggerganov/llama.cpp

      - name: Configure
        run: |
          cmake -S src -B build \
            -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-24 \
            -DANDROID_ARM_NEON=ON \
            -DLLAMA_DIR=$PWD/llama.cpp \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build -j

      - name: Package
        run: |
          mkdir -p out
          cp build/libllama.so out/libllama.so
          cd out
          sha256sum libllama.so > libllama.so.sha256
          ls -lh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: libllama-so
          path: out/*

      - name: Create Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Lexa Native v1.0.${{ github.run_number }}
          files: |
            out/libllama.so
            out/libllama.so.sha256
          token: ${{ secrets.GITHUB_TOKEN }}
